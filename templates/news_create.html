<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create News</title>


<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:Arial, sans-serif;
    }

    body{
        background:#f5f9ff;
        display:flex;
        justify-content:center;
        align-items:center;
        min-height:100vh;
        padding:20px;
    }

    .card{
        width:100%;
        max-width:600px;
        background:white;
        padding:35px;
        border-radius:20px;
        box-shadow:0 10px 30px rgba(0,0,0,.08);
    }

    h1{
        text-align:center;
        color:#0f172a;
        margin-bottom:25px;
    }

    .home-btn{
        display:inline-block;
        text-decoration:none;
        background:#64748b;
        color:white;
        padding:10px 18px;
        border-radius:10px;
        margin-bottom:20px;
    }

    .home-btn:hover{
        background:#475569;
    }

    input{
        width:100%;
        padding:14px;
        margin-bottom:15px;
        border:1px solid #cbd5e1;
        border-radius:10px;
        font-size:15px;
    }

    input:focus{
        outline:none;
        border-color:#2563eb;
    }

    .submit-btn{
        width:100%;
        background:#2563eb;
        color:white;
        border:none;
        padding:14px;
        border-radius:10px;
        font-size:16px;
        cursor:pointer;
        transition:.3s;
    }

    .submit-btn:hover{
        background:#1d4ed8;
    }
</style>


</head>
<body>

<div class="card">


<a href="{% url 'news-list' %}" class="home-btn">
    ← Home Page
</a>

<h1>Create News</h1>

<form method="POST" enctype="multipart/form-data">

    {% csrf_token %}

    <input type="text" name="title" placeholder="News Title">

    <input type="text" name="content" placeholder="News Content">

    <input type="file" name="image">

    <button type="submit" class="submit-btn">
        Save News
    </button>

</form>


</div>

</body>
</html>
