<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update News</title>


<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:Arial, sans-serif;
    }

    body{
        background:#f5f9ff;
        display:flex;
        justify-content:center;
        align-items:center;
        min-height:100vh;
        padding:20px;
    }

    .card{
        width:100%;
        max-width:650px;
        background:white;
        padding:35px;
        border-radius:20px;
        box-shadow:0 10px 30px rgba(0,0,0,.08);
    }

    .top-links{
        display:flex;
        gap:10px;
        margin-bottom:25px;
    }

    .btn{
        text-decoration:none;
        color:white;
        padding:10px 18px;
        border-radius:10px;
        font-weight:600;
    }

    .home{
        background:#64748b;
    }

    .back{
        background:#2563eb;
    }

    h1{
        text-align:center;
        color:#0f172a;
        margin-bottom:25px;
    }

    input{
        width:100%;
        padding:14px;
        margin-bottom:15px;
        border:1px solid #cbd5e1;
        border-radius:10px;
        font-size:15px;
    }

    input:focus{
        outline:none;
        border-color:#2563eb;
    }

    .save-btn{
        width:100%;
        border:none;
        background:#2563eb;
        color:white;
        padding:14px;
        border-radius:10px;
        font-size:16px;
        cursor:pointer;
        transition:.3s;
    }

    .save-btn:hover{
        background:#1d4ed8;
    }
</style>


</head>
<body>

<div class="card">


<div class="top-links">
    <a href="{% url 'news-list' %}" class="btn home">
        Home Page
    </a>

    <a href="{% url 'news-detail' pk=new.pk %}" class="btn back">
        Back
    </a>
</div>

<h1>Update News</h1>

<form method="POST" enctype="multipart/form-data">

    {% csrf_token %}

    <input type="text"
           name="title"
           value="{{ new.title }}"
           placeholder="New title">

    <input type="text"
           name="content"
           value="{{ new.content }}"
           placeholder="New content">

    <input type="file" name="image">

    <button type="submit" class="save-btn">
        Update News
    </button>

</form>


</div>

</body>
</html>
