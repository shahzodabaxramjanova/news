<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete News</title>


<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:Arial, sans-serif;
    }

    body{
        background:#f5f9ff;
        display:flex;
        justify-content:center;
        align-items:center;
        min-height:100vh;
        padding:20px;
    }

    .card{
        background:white;
        max-width:550px;
        width:100%;
        padding:40px;
        border-radius:20px;
        text-align:center;
        box-shadow:0 10px 30px rgba(0,0,0,.08);
    }

    h2{
        color:#0f172a;
        margin-bottom:15px;
    }

    p{
        color:#64748b;
        margin-bottom:30px;
        font-size:18px;
    }

    .buttons{
        display:flex;
        justify-content:center;
        gap:15px;
    }

    .btn{
        padding:12px 22px;
        border:none;
        border-radius:10px;
        font-size:15px;
        cursor:pointer;
        text-decoration:none;
        color:white;
        font-weight:600;
    }

    .delete-btn{
        background:#dc2626;
    }

    .delete-btn:hover{
        background:#b91c1c;
    }

    .back-btn{
        background:#2563eb;
    }

    .back-btn:hover{
        background:#1d4ed8;
    }
</style>


</head>
<body>

<div class="card">


<h2>{{ new.title }}</h2>

<p>Are you sure you want to delete this news?</p>

<form method="POST">
    {% csrf_token %}

    <div class="buttons">

        <button type="submit" class="btn delete-btn">
            Yes, Delete
        </button>

        <a href="{% url 'news-detail' new.pk %}" class="btn back-btn">
            No, Back
        </a>

    </div>

</form>


</div>

</body>
</html>
