<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ new.title }}</title>


<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:Arial, sans-serif;
    }

    body{
        background:#f5f9ff;
        padding:40px;
    }

    .container{
        max-width:900px;
        margin:auto;
        background:white;
        border-radius:20px;
        overflow:hidden;
        box-shadow:0 10px 30px rgba(0,0,0,.08);
    }

    .top-bar{
        display:flex;
        gap:12px;
        padding:20px;
        background:#eff6ff;
    }

    .btn{
        text-decoration:none;
        padding:10px 18px;
        border-radius:10px;
        color:white;
        font-weight:600;
        transition:.3s;
    }

    .edit{
        background:#2563eb;
    }

    .edit:hover{
        background:#1d4ed8;
    }

    .delete{
        background:#dc2626;
    }

    .delete:hover{
        background:#b91c1c;
    }

    .back{
        background:#64748b;
    }

    .back:hover{
        background:#475569;
    }

    .image{
        width:100%;
        height:450px;
        object-fit:cover;
    }

    .content{
        padding:30px;
    }

    .content h1{
        color:#0f172a;
        margin-bottom:20px;
    }

    .content p{
        color:#475569;
        line-height:1.8;
        font-size:17px;
    }
</style>


</head>
<body>

<div class="container">


<div class="top-bar">
    <a href="{% url 'news-update' new.pk %}" class="btn edit">
        Edit
    </a>

    <a href="{% url 'news-delete' new.pk %}" class="btn delete">
        Delete
    </a>

    <a href="{% url 'news-list' %}" class="btn back">
        Back
    </a>
</div>

<img src="{{ new.image.url }}" class="image">

<div class="content">
    <h1>{{ new.title }}</h1>
    <p>{{ new.content }}</p>
</div>


</div>

</body>
</html>
