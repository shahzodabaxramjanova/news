<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Website</title>


<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:Arial, sans-serif;
    }

    body{
        background:#f5f9ff;
        padding:40px;
    }

    .container{
        max-width:1200px;
        margin:auto;
    }

    .header{
        display:flex;
        justify-content:space-between;
        align-items:center;
        margin-bottom:30px;
    }

    .header h1{
        color:#0f172a;
    }

    .add-btn{
        text-decoration:none;
        background:#2563eb;
        color:white;
        padding:12px 20px;
        border-radius:10px;
        font-weight:bold;
        transition:.3s;
    }

    .add-btn:hover{
        background:#1d4ed8;
    }

    .news-grid{
        display:grid;
        grid-template-columns:repeat(auto-fill,minmax(350px,1fr));
        gap:25px;
    }

    .card{
        background:white;
        border-radius:18px;
        overflow:hidden;
        box-shadow:0 10px 25px rgba(0,0,0,.08);
        transition:.3s;
    }

    .card:hover{
        transform:translateY(-5px);
    }

    .card img{
        width:100%;
        height:230px;
        object-fit:cover;
    }

    .content{
        padding:20px;
    }

    .title{
        text-decoration:none;
        color:#0f172a;
    }

    .title h2{
        margin-bottom:12px;
    }

    .title:hover{
        color:#2563eb;
    }

    .content p{
        color:#64748b;
        line-height:1.6;
    }
</style>


</head>
<body>

<div class="container">


<div class="header">
    <h1>Latest News</h1>
    <a href="{% url 'news-create' %}" class="add-btn">
        + Add News
    </a>
</div>

<div class="news-grid">

    {% for news in newz %}

    <div class="card">

        <img src="{{ news.image.url }}" alt="news">

        <div class="content">

            <a href="{% url 'news-detail' news.pk %}" class="title">
                <h2>{{ news.title }}</h2>
            </a>

            <p>{{ news.content|truncatewords:20 }}</p>

        </div>

    </div>

    {% endfor %}

</div>


</div>

</body>
</html>
